[main]
font=FiraCode Nerd Font:size=12
prompt="> "
lines=15
width=50
horizontal-pad=20
vertical-pad=10
inner-pad=10

[colors]
# Background: Gruvbox Dark Hard ($1d2021)
background=1d2021ff
# Text: Gruvbox FG ($ebdbb2)
text=ebdbb2ff
# Match/Search highlights: Gruvbox Yellow ($fabd2f)
match=fabd2fff
# Selection Background: Gruvbox Dark 2 ($3c3836)
selection=3c3836ff
# Selection Text: Gruvbox Light Aqua ($8ec07c)
selection-text=8ec07cff
# Selection Match: Gruvbox Orange ($fe8019)
selection-match=fe8019ff
# Border: Gruvbox Dark Gray/Foreground ($928374)
border=928374ff

[border]
width=2
radius=8

[dmenu]
mode=text
